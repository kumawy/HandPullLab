name: HandPullLab
options:
  deploymentTarget:
    iOS: '18.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    IPHONEOS_DEPLOYMENT_TARGET: '18.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  HandPullLab:
    type: application
    platform: iOS
    sources:
      - path: HandPullLab
        excludes: [Resources/HandPullRemotion]
      - path: HandPullLab/Resources/HandPullRemotion
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.handpulllab.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_CFBundleDisplayName: HandPullLab
  HandPullLabTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HandPullLabTests]
    dependencies:
      - target: HandPullLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.handpulllab.tests
  HandPullLabUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HandPullLabUITests]
    dependencies:
      - target: HandPullLab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.handpulllab.uitests
schemes:
  HandPullLab:
    build:
      targets:
        HandPullLab: all
    test:
      targets: [HandPullLabTests, HandPullLabUITests]
